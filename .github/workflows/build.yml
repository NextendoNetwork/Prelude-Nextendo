# ------------------------------------------------------------------
# Build NRO — compila Prelude (nextendo.nro) y, en un tag v*, lo
# adjunta a la release. Se dispara al:
#   - hacer merge de un PR (push a main)
#   - pushear un commit a main o a una rama arena/*
#   - pushear un tag v*
#   - abrir / actualizar un PR contra main
#   - ejecutarlo a mano (workflow_dispatch)
# ------------------------------------------------------------------
name: Build NRO

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify update failures preserve the installed NRO
        run: |
          cc -std=c11 -Wall -Wextra -Werror tools/test_safe_update.c -o /tmp/test-safe-update
          /tmp/test-safe-update
          cc -std=gnu11 -Wall -Wextra -Werror -I source tools/test_hosts_refresh.c -o /tmp/test-hosts-refresh
          /tmp/test-hosts-refresh
          cc -std=c11 -Wall -Wextra -Werror tools/test_config_io.c -o /tmp/test-config-io
          /tmp/test-config-io
          cc -std=c11 -Wall -Wextra -Werror tools/test_resource_copy.c -o /tmp/test-resource-copy
          /tmp/test-resource-copy
          python3 tools/test_resource_cleanup.py
          python3 tools/test_reinstall_action.py
          cc -std=c11 -Wall -Wextra -Werror tools/test_http.c source/prelude_http.c -o /tmp/test-http
          /tmp/test-http
          python3 tools/test_config_editors.py
          python3 tools/test_mode_isolation.py
          python3 tools/test_nintendo_dns_block.py
          python3 tools/test_ggst_hosts.py
          cc -std=c11 -Wall -Wextra -Werror tools/test_prodinfo_flags.c -o /tmp/test-prodinfo-flags
          /tmp/test-prodinfo-flags
          python3 tools/test_download_stream.py

  build:
    needs: updater-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION from Makefile: ${APP_VERSION}"

      - name: Check version alignment
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          MAJOR=$(sed -n 's/^#define NEXTENDO_VERSION_MAJOR *//p' source/nextendo_update.h)
          MINOR=$(sed -n 's/^#define NEXTENDO_VERSION_MINOR *//p' source/nextendo_update.h)
          PATCH=$(sed -n 's/^#define NEXTENDO_VERSION_PATCH *//p' source/nextendo_update.h)
          FALLBACK="${MAJOR}.${MINOR}.${PATCH}"
          echo "Makefile APP_VERSION             = ${APP_VERSION}"
          echo "nextendo_update.h semver fallback = ${FALLBACK}"
          if [ "${APP_VERSION}" != "${FALLBACK}" ]; then
            echo "::error::Version mismatch between Makefile and nextendo_update.h"
            exit 1
          fi

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: |
          APP_VERSION=$(sed -n 's/^APP_VERSION := *//p' Makefile)
          if [ "v${APP_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match APP_VERSION v${APP_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: |
          # NO forzar `dkp-pacman -Syyu`: el refresh de bases toca pkg.devkitpro.org,
          # que devuelve 403 intermitente desde los runners de GitHub Actions
          # ("failed retrieving dkp-libs.db"). La imagen devkita64 ya trae
          # switch-portlibs (freetype, mpg123, ...), asi que `--needed` no descarga
          # nada si ya estan -> via rapida sin red.
          if dkp-pacman -S --needed --noconfirm switch-freetype switch-mpg123; then
            exit 0
          fi
          # Via lenta, solo si de verdad faltaba algo: un unico refresh (-Sy) y
          # reintento. Se evita -Syyu (doble refresh) que era lo que disparaba el 403.
          ok=0
          for attempt in 1 2 3; do
            if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm switch-freetype switch-mpg123; then
              ok=1
              break
            fi
            echo "::warning::dkp-pacman install failed (attempt ${attempt}); retrying..."
            sleep 10
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::Could not install switch-freetype / switch-mpg123 after 3 attempts"
            exit 1
          fi

      - name: Fetch Account Link fallback binary
        run: |
          TARGET_DIR="romfs/account_link/atmosphere/contents/4200000000000666"
          mkdir -p "${TARGET_DIR}/flags"
          if [ ! -f "${TARGET_DIR}/exefs.nsp" ]; then
            echo "Fetching network_mitm v2 release asset..."
            curl -sL "https://github.com/W-874/network_mitm/releases/download/v2.0.0-account-link-fallback/network_mitm-account-link-fallback-v2-system-only.zip" -o /tmp/network_mitm.zip
            python3 -c "import zipfile; z=zipfile.ZipFile('/tmp/network_mitm.zip'); f=[n for n in z.namelist() if n.endswith('exefs.nsp')][0]; open('${TARGET_DIR}/exefs.nsp', 'wb').write(z.read(f))" || true
            rm -f /tmp/network_mitm.zip
          fi
          test -f "${TARGET_DIR}/exefs.nsp" || echo "::warning::exefs.nsp not present"
          # Pin the third-party sysmodule: it runs as a system module on every console that
          # installs Prelude, so a changed upstream asset must never ship silently.
          # This hash is the exefs.nsp already shipped in v4.0.6.
          EXPECTED_SHA256="ec179ddc06e671197b5b7df210e3676871d1d469a91aec191e31ad1f7d5efc2d"
          if [ -f "${TARGET_DIR}/exefs.nsp" ]; then
            ACTUAL_SHA256=$(sha256sum "${TARGET_DIR}/exefs.nsp" | cut -d' ' -f1)
            if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
              echo "::error::network_mitm exefs.nsp hash mismatch (${ACTUAL_SHA256})"
              exit 1
            fi
          fi

      - name: Build
        run: make -j"$(nproc)"

      - name: Check NRO output
        run: |
          test -f nextendo.nro
          ls -lh nextendo.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextendo
          path: nextendo.nro
          if-no-files-found: error

      - name: Upload NRO to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: nextendo.nro
          generate_release_notes: true

      - name: Build download-only diagnostic
        if: github.event_name == 'pull_request'
        run: |
          cp nextendo.nro /tmp/nextendo-production.nro
          make clean
          make -j"$(nproc)" DEFINES=-DPRELUDE_UPDATE_PROBE APP_TITLE="Prelude Updater Test"
          mv nextendo.nro nextendo-updater-test.nro
          cp /tmp/nextendo-production.nro nextendo.nro

      - name: Upload download-only diagnostic
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: prelude-updater-test
          path: nextendo-updater-test.nro
          if-no-files-found: error
